<script>
// Must match the farmer dashboard. Leave '' for same-browser demo; paste your Firebase Realtime DB URL for a real phone.
// IMPORTANT: Set the SAME Firebase Realtime Database URL in BOTH farmer and agronomist files
// for notifications to work across different devices/browsers. Example:
// const FIREBASE_URL = 'https://your-project-default-rtdb.firebaseio.com';
// Leave blank only for a same-origin local demo (serve both HTML files from the same local web server).
const FIREBASE_URL = '';
const SYNC_KEY = 'ag_case';
const SYNC_PATH = '/agriguard_case.json';
const Sync = {
  channel: null,
  async set(c) {
    const j = JSON.stringify(c);
    try { localStorage.setItem(SYNC_KEY, j); } catch (e) {}
    try { if (this.channel) this.channel.postMessage(c); } catch (e) {}
    if (FIREBASE_URL) {
      try {
        const r = await fetch(FIREBASE_URL.replace(/\/$/, '') + SYNC_PATH, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: j
        });
        if (!r.ok) throw new Error('Firebase HTTP ' + r.status);
      } catch (e) {
        console.error('AgriGuard Firebase write failed:', e);
        return false;
      }
    }
    return true;
  },
  async get() {
    if (FIREBASE_URL) {
      try {
        const r = await fetch(FIREBASE_URL.replace(/\/$/, '') + SYNC_PATH + '?_=' + Date.now(), { cache: 'no-store' });
        if (!r.ok) throw new Error('Firebase HTTP ' + r.status);
        const c = await r.json();
        if (c) { try { localStorage.setItem(SYNC_KEY, JSON.stringify(c)); } catch (e) {} }
        return c;
      } catch (e) {
        console.error('AgriGuard Firebase read failed:', e);
      }
    }
    try { return JSON.parse(localStorage.getItem(SYNC_KEY)); } catch (e) { return null; }
  },
  watch(cb) {
    let last = '';
    const emit = c => {
      const j = JSON.stringify(c);
      if (j !== last) { last = j; cb(c); }
    };
    try {
      if ('BroadcastChannel' in window) {
        this.channel = new BroadcastChannel('agriguard_case_sync');
        this.channel.onmessage = e => emit(e.data);
      }
    } catch (e) {}
    window.addEventListener('storage', e => {
      if (e.key === SYNC_KEY && e.newValue) {
        try { emit(JSON.parse(e.newValue)); } catch (err) {}
      }
    });
    const poll = async () => emit(await this.get());
    poll();
    setInterval(poll, 1500);
  }
};

let current = null, seen = null;
const row = (k, v) => `<div class="flex justify-between gap-3 bg-slate-800/60 rounded-lg px-3 py-2"><span class="text-slate-400">${k}</span><span class="font-medium text-right">${v}</span></div>`;
const card = (icon, title, msg, cls) => `<div class="rounded-2xl border ${cls} p-6 text-center"><div class="text-4xl mb-2">${icon}</div><div class="font-semibold">${title}</div><p class="text-sm text-slate-400 mt-1">${msg}</p></div>`;

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
const num = (v, d = 0) => (v == null || v === '' || !Number.isFinite(Number(v))) ? '—' : Number(v).toFixed(d);
const acres = v => (v == null || !Number.isFinite(Number(v))) ? '—' : Number(v).toFixed(2) + ' acres';
const confTxt = c => (c.confidence == null || !Number.isFinite(Number(c.confidence))) ? '' : ' (' + Number(c.confidence).toFixed(1) + '%)';
const sec = t => `<div class="pt-3 pb-1 text-xs font-semibold uppercase tracking-wide text-slate-400">${t}</div>`;
const doseRow = d => row(esc(d.name) + `<span class="block text-xs">${esc(d.rate)}</span>`, `<span class="font-bold text-emerald-400">${esc(d.qty)}</span>`);

// Pesticide + fertilizer prescription with the dosage the farmer's Calculation tab produced
function prescription(c) {
  if (!Array.isArray(c.doses) || !c.doses.length)   // older cases without dose data
    return sec('Prescription') + row('Pesticide', esc(c.pest)) + row('Method', esc(c.method)) + row('Fertilizer', esc(c.fert));
  const pest = c.doses.filter(d => /^pesticide/i.test(d.cat)), fert = c.doses.filter(d => !/^pesticide/i.test(d.cat));
  const forArea = ' · for ' + acres(c.affectedAcres) + ' infected';
  return (pest.length ? sec((/vector/i.test(pest[0].cat) ? 'Pesticides (vector control)' : 'Pesticides') + forArea) + pest.map(doseRow).join('') : '') +
         (fert.length ? sec('Fertilizers' + forArea) + fert.map(doseRow).join('') : '') +
         sec('Application') + row('Method', esc(c.method));
}

function render(c) {
  const m = document.getElementById('main');
  if (!c) { m.innerHTML = card('🌾', 'No pending cases', 'You will get a pop-up here the moment a farmer finishes a crop analysis.', 'border-slate-800 bg-slate-900/60'); return; }
  const info = `<div class="mt-4 space-y-2 text-sm">${row('Case', esc(c.id))}${row('Crop', esc(c.crop || '—'))}${row('Disease', esc(c.disease) + confTxt(c))}${row('Infected part', esc(c.part))}${row('Damage', num(c.affectedPct) + '% • ' + acres(c.affectedAcres))}</div>${prescription(c) ? '<div class="mt-2 space-y-2 text-sm">' + prescription(c) + '</div>' : ''}`;
  if (c.status === 'pending') m.innerHTML = card('⏳', 'Waiting for your decision', 'Tap below to open the case.', 'border-amber-500/40 bg-amber-500/10') + `<button onclick="openPopup()" class="w-full mt-4 py-3 rounded-xl bg-indigo-600 font-semibold">Open case</button>`;
  else if (c.status === 'approved') m.innerHTML = card('✅', 'You approved this recommendation', 'The farmer can now place the delivery order.', 'border-emerald-500/40 bg-emerald-500/10') + info;
  else if (c.status === 'rejected') m.innerHTML = card('❌', 'You rejected this recommendation', 'The farmer has been asked to book a visit with an agronomist.', 'border-rose-500/40 bg-rose-500/10') + info;
  else if (c.status === 'visit_booked') m.innerHTML = card('📅', 'Visit booked by the farmer', `${c.visit.name} • ${c.visit.slot}`, 'border-indigo-500/40 bg-indigo-500/10') + info;
}

function openPopup() {
  const c = current; if (!c) return;
  document.getElementById('p-id').textContent = c.id + ' • ' + c.village;
  const img = document.getElementById('p-img');
  if (c.img) { img.src = c.img; img.classList.remove('hidden'); } else img.classList.add('hidden');
  const s = c.sensors || {};
  document.getElementById('p-body').innerHTML =
    row('Crop', esc(c.crop || '—')) +
    row('Detected disease', esc(c.disease) + confTxt(c)) + row('Infected part', esc(c.part)) +
    row('Severity', esc(c.severity) + ' • ' + num(c.affectedPct) + '% of farm infected') +
    row('Farm / Infected area', acres(c.areaAcres) + ' / ' + acres(c.affectedAcres)) +
    row('Soil / Humidity', num(s.soil) + '% / ' + num(s.humidity) + '%') +
    row('Temp / Rain', num(s.temp, 1) + '°C / ' + (s.rain ? 'Yes' : 'No')) +
    prescription(c);
  document.getElementById('popup').classList.remove('hidden');
  if (navigator.vibrate) navigator.vibrate([300, 150, 300]);
}

async function decide(status) {
  const c = await Sync.get();
  if (!c || c.id !== current.id) return;
  c.status = status; c.decidedAt = Date.now();
  const syncOk = await Sync.set(c);
  if (FIREBASE_URL && !syncOk) {
    alert('Decision was not sent to the farmer. Check Firebase URL, database rules and internet connection, then try again.');
    return;
  }
  document.getElementById('popup').classList.add('hidden');
}

Sync.watch(c => {
  current = c; render(c);
  if (c && c.status === 'pending' && c.id !== seen) { seen = c.id; openPopup(); }
  if (!c || c.status !== 'pending') document.getElementById('popup').classList.add('hidden');
});
render(null);
</script>
</body>
